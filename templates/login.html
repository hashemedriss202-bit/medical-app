<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - النظام الطبي الذكي</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .login-container h1 {
            margin-bottom: 20px;
            color: #333;
        }
        .login-container input {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 16px;
        }
        .login-container button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
        }
        .flash-message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
        }
        .flash-success { background: #d4edda; color: #155724; }
        .flash-danger { background: #f8d7da; color: #721c24; }
        .flash-warning { background: #fff3cd; color: #856404; }
        .flash-info { background: #d1ecf1; color: #0c5460; }
        .link {
            margin-top: 20px;
            display: block;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🏥 النظام الطبي الذكي</h1>
        <h2>🔐 تسجيل الدخول</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-message flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        
        <form method="POST">
            <input type="text" name="username" placeholder="اسم المستخدم" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">🚪 دخول</button>
        </form>
        
        <a href="/register" class="link">📝 ليس لديك حساب؟ سجل الآن</a>
        <p style="margin-top: 20px; font-size: 12px; color: #888;">تجريبي: doctor / doctor123 | patient / patient123</p>
    </div>
</body>
</html>
